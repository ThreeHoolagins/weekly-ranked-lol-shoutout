[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "RUF",   # ruff-specific
    "PIE",   # flake8-pie
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez
    "UP",    # pyupgrade
    "S",     # flake8-bandit
    "N",     # pep8-naming
    "T20",   # flake8-print
    "ERA",   # eradicate
]
ignore = [
    # The project uses camelCase for functions, arguments, and variables
    "N802",
    "N803",
    "N806",
    "N801",  # class names (e.g. rankedPlayer) are camelCase too
    "N818",  # exceptions are named FooException, not FooError
]

[tool.ruff.lint.per-file-ignores]
# Interactive CLI scripts: print is the UI, the Python version guard must run before
# the tomllib import, and setup.py shells out to pip with fixed arguments
"scripts/*" = ["T201", "E402", "UP036", "S603"]
